apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: todo-list
  name: todo-list
  namespace: todo-list
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-list
  template:
    metadata:
      labels:
        app: todo-list
    spec:
      containers:
      - image: kartoshkasmyasom/todo-list
        name: todo-list
        volumeMounts:
        - name: data
          mountPath: /app/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: pvc-todo-list
