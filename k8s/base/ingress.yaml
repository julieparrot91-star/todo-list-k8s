apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-list--ingress
  namespace: todo-list
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: todo-list-service
            port:
              number: 80

