podLabels: 
  "azure.workload.identity/use": "true"

serviceAccount:
  labels: 
    "azure.workload.identity/use": "true"
  annotations: 
    "azure.workload.identity/client-id": "a28ea4c0-7e77-47c2-ae86-ae8a1e2ae1f0"
  automountServiceAccountToken: true

logLevel: debug
logFormat: json
interval: 1m

provider: azure

sources:
  - ingress
  - service

dnsPolicy: Default

domainFilters: 
  - julienp-kubernetes.click

extraArgs:
  - --azure-user-assigned-identity-client-id=a28ea4c0-7e77-47c2-ae86-ae8a1e2ae1f0

extraVolumes:
  - name: azure-config-file
    secret:
      secretName: external-dns-azure
extraVolumeMounts:
  - name: azure-config-file
    mountPath: /etc/kubernetes
    readOnly: true
