# Secret pour Grafana Azure AD - À créer avec les vraies valeurs
# kubectl create secret generic grafana-azuread-secret \
#   --from-literal=GF_AUTH_AZUREAD_CLIENT_SECRET=your-client-secret \
#   -n monitoring
apiVersion: v1
kind: Secret
metadata:
  name: grafana-azuread-secret
  namespace: monitoring
type: Opaque
# Remplacer par les vraies valeurs encodées en base64
# stringData:
#   GF_AUTH_AZUREAD_CLIENT_SECRET: "your-client-secret"
